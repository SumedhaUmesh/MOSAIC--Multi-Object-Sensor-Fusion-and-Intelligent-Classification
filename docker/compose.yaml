services:
  mosaic-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mosaic-dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspace
    ports:
      - "8765:8765"
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/docker/fastdds_disable_shm.xml
